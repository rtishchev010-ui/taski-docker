name: Main Taski Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taski-production
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_user -d django_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install flake8==7.3.0 flake8-isort==7.0.0
          python -m pip install -r backend/requirements.txt

      - name: Check code style
        run: python -m flake8 backend/

      - name: Run Django tests
        working-directory: backend
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: django_db
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
        run: python manage.py test



  frontend_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '18'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand

  build_images:
    runs-on: ubuntu-latest
    needs: [tests, frontend_tests]
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, gateway]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: |
            rtishchev01/taski_${{ matrix.component }}:latest
            rtishchev01/taski_${{ matrix.component }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_images
    steps:
      - uses: actions/checkout@v7

      - name: Copy production Compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.production.yml
          target: /home/ubuntu/taski-docker

      - name: Deploy Taski
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            cd /home/ubuntu/taski-docker

            sudo docker compose -f docker-compose.production.yml config -q
            sudo docker compose -f docker-compose.production.yml pull
            sudo docker compose -f docker-compose.production.yml up -d db

            ready=0
            for attempt in $(seq 1 30); do
              if sudo docker compose -f docker-compose.production.yml exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" -eq 1

            mkdir -p backups
            chmod 700 backups
            umask 077
            sudo docker compose -f docker-compose.production.yml exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "backups/before-deploy-$(date +%Y%m%d-%H%M%S).sql"

            sudo docker compose -f docker-compose.production.yml up -d backend
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            sudo docker compose -f docker-compose.production.yml exec -T backend mkdir -p /backend_static/static
            sudo docker compose -f docker-compose.production.yml exec -T backend cp -r /app/collected_static/. /backend_static/static/

            sudo docker compose -f docker-compose.production.yml run --rm --no-deps frontend
            sudo docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate gateway

            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 --max-time 20 https://andrey-taski.servehttp.com/ > /dev/null
            curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 3 --max-time 20 https://andrey-taski.servehttp.com/api/tasks/ > /dev/null

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой Taski успешно выполнен!
            https://andrey-taski.servehttp.com/
            Коммит: ${{ github.sha }}